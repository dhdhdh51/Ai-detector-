name: Android Release

# Builds a signed, Play-ready release APK and AAB.
#
#  * Triggered by pushing a tag like v1.0.0, or manually from the Actions tab.
#  * Signing material comes from repository secrets created by tools/setup-signing.sh:
#
#      ANDROID_KEYSTORE_BASE64    base64 of your .jks   (base64 -w0 release.jks)
#      ANDROID_KEYSTORE_PASSWORD  keystore password
#      ANDROID_KEY_ALIAS          key alias
#      ANDROID_KEY_PASSWORD       key password
#
#  * With no secrets the build still succeeds and falls back to debug signing, so the pipeline is
#    never red just because signing is not configured yet. Such artifacts are for testing only.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Mapped at job level so the optional signing steps can use an `env` check
    # (the `secrets` context is not available in step-level `if` expressions).
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "Keystore decoded ($(stat -c%s "$RUNNER_TEMP/release.jks") bytes)"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signature
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk artifacts/FitBudget-release.apk
          cp app/build/outputs/bundle/release/app-release.aab artifacts/FitBudget-release.aab

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs artifacts/FitBudget-release.apk
          ls -lh artifacts

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FitBudget-release.apk
          path: artifacts/FitBudget-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: FitBudget-release.aab
          path: artifacts/FitBudget-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/FitBudget-release.apk
            artifacts/FitBudget-release.aab
          generate_release_notes: true
