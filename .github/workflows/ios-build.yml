name: iOS Build

on:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Shared core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # FitBudgetCore is pure Swift + Foundation, so the calculations, validation, streaks and
      # meal-plan generator that ship in the app are verified here without needing a Mac.
      - name: Build shared core
        working-directory: ios
        run: swift build

      - name: Test shared core
        working-directory: ios
        run: swift test

  app-build:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild -list -project FitBudget.xcodeproj

      - name: Test shared core on macOS
        working-directory: ios
        run: swift test

      # Compiles every SwiftUI / SwiftData source against the real iOS SDK. No signing material is
      # needed, so this runs on forks and pull requests too.
      - name: Build app (unsigned, device SDK)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project FitBudget.xcodeproj \
            -scheme FitBudget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned app
        working-directory: ios
        run: |
          APP_PATH="$(find build/Build/Products -maxdepth 2 -name 'FitBudget.app' -print -quit)"
          test -n "$APP_PATH" || { echo "FitBudget.app not found"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/artifacts/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/artifacts/Payload/"
          cd "$GITHUB_WORKSPACE/artifacts"
          zip -qry FitBudget-unsigned.zip Payload
          rm -rf Payload
          ls -lh

      - name: Upload unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: FitBudget-ios-unsigned.zip
          path: artifacts/FitBudget-unsigned.zip
          if-no-files-found: error
          retention-days: 30
